[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_SHARP_PATH = "node_modules/sharp"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.vidking.net https://multiembed.mov; frame-src https://www.vidking.net https://multiembed.mov https://streamingnow.mov; img-src 'self' data: https://image.tmdb.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.themoviedb.org https://www.vidking.net https://multiembed.mov; media-src 'self' https://www.vidking.net https://multiembed.mov https://streamingnow.mov;"

[[redirects]]
  from = "/tv-shows"
  to = "/tv"
  status = 301
